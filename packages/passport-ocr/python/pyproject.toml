[project]
name = "india-document-ocr-runtime"
version = "3.1.0"
description = "Local Python runtime bundled with the document-ocr npm package"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "rapidocr>=3.0.0",
    "onnxruntime>=1.17,<2",
    "opencv-python>=4.8,<5",
    "pillow>=12.3,<13",
    "numpy>=1.24,<3",
    "rapidfuzz>=3.0,<4",
    "fastapi>=0.135.1,<1",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.27,<1",
    "click>=8.3.3,<9",
    "python-multipart>=0.0.31,<1",
    "requests>=2.33,<3",
    "idna>=3.15,<4",
    "urllib3>=2.7,<3",
    "pypdfium2>=5.0,<6",
    "pillow-heif>=1.3,<2",
    "zxing-cpp>=3.1.1,<4",
    "pycountry>=26.2.16,<27",
    "cryptography>=50.0.1,<51",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
