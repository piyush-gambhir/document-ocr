services:
  ocr:
    image: ${IMAGE_URI:-document-ocr:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        DOCUMENT_OCR_KYC_LANGS: ${DOCUMENT_OCR_KYC_LANGS:-en}
    environment:
      DOCUMENT_OCR_KYC_LANGS: ${DOCUMENT_OCR_KYC_LANGS:-en}
      API_TOKEN: ${API_TOKEN:?Set a strong API_TOKEN before starting the server}
    expose: ['8000']
    restart: unless-stopped
    init: true
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 120s
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the DNS name pointing to this server}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ocr:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
