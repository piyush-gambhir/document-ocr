# Opt-in only: use with compose.yaml and --profile jobs.
services:
  ocr:
    environment:
      DOCUMENT_OCR_JOBS_DIR: /var/lib/document-ocr/jobs
      DOCUMENT_OCR_JOB_KEY: ${DOCUMENT_OCR_JOB_KEY:?Set DOCUMENT_OCR_JOB_KEY}
      DOCUMENT_OCR_JOB_RETENTION_SECONDS: ${DOCUMENT_OCR_JOB_RETENTION_SECONDS:-86400}
      DOCUMENT_OCR_WEBHOOK_URL: ${DOCUMENT_OCR_WEBHOOK_URL:-}
      DOCUMENT_OCR_WEBHOOK_SECRET: ${DOCUMENT_OCR_WEBHOOK_SECRET:-}
    volumes:
      - ocr_jobs:/var/lib/document-ocr/jobs
  worker:
    profiles: [jobs]
    image: ${IMAGE_URI:-document-ocr:local}
    pull_policy: never
    command: [python, -m, core.jobs, worker]
    environment:
      DOCUMENT_OCR_KYC_LANGS: ${DOCUMENT_OCR_KYC_LANGS:-en}
      DOCUMENT_OCR_JOBS_DIR: /var/lib/document-ocr/jobs
      DOCUMENT_OCR_JOB_KEY: ${DOCUMENT_OCR_JOB_KEY:?Set DOCUMENT_OCR_JOB_KEY}
      DOCUMENT_OCR_JOB_RETENTION_SECONDS: ${DOCUMENT_OCR_JOB_RETENTION_SECONDS:-86400}
      DOCUMENT_OCR_WEBHOOK_URL: ${DOCUMENT_OCR_WEBHOOK_URL:-}
      DOCUMENT_OCR_WEBHOOK_SECRET: ${DOCUMENT_OCR_WEBHOOK_SECRET:-}
    volumes:
      - ocr_jobs:/var/lib/document-ocr/jobs
    healthcheck:
      disable: true
    depends_on:
      ocr:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cpus: 2.0
    mem_limit: 2g
volumes:
  ocr_jobs:
