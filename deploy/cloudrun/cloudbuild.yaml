# Remote amd64 build. Deployment is owned by deploy.sh and render_service.py.
substitutions:
  _IMAGE_URI: 'IMAGE_URI_REQUIRED'
  _KYC_LANGS: en
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --file=deploy/docker/Dockerfile
      - '--build-arg=DOCUMENT_OCR_KYC_LANGS=${_KYC_LANGS}'
      - '--tag=${_IMAGE_URI}'
      - .
images:
  - '${_IMAGE_URI}'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
