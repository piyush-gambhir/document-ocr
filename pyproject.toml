[project]
name = "india-document-ocr"
version = "3.1.0"
description = "Local OCR for passports, Indian KYC and US documents, with evidence, review tools, and portable workers"
requires-python = ">=3.12"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "Piyush Gambhir" },
]
keywords = ["ocr", "passport", "aadhaar", "pan", "kyc", "nrega", "npr", "rapidocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "rapidocr>=3.0.0",
    "onnxruntime>=1.17,<2",
    "opencv-python>=4.8,<5",
    "pillow>=12.3,<13",
    "numpy>=1.24,<3",
    "rapidfuzz>=3.0,<4",
    "fastapi>=0.135.1,<1",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.27,<1",
    "click>=8.3.3,<9",
    "python-multipart>=0.0.31,<1",
    "requests>=2.33,<3",
    "idna>=3.15,<4",
    "urllib3>=2.7,<3",
    "pypdfium2>=5.0,<6",
    "pillow-heif>=1.3,<2",
    "zxing-cpp>=3.1.1,<4",
    "pycountry>=26.2.16,<27",
    "cryptography>=50.0.1,<51",
]

[project.urls]
Homepage = "https://github.com/piyush-gambhir/document-ocr"
Repository = "https://github.com/piyush-gambhir/document-ocr"
Issues = "https://github.com/piyush-gambhir/document-ocr/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=7.0,<8",
    "pygments>=2.20,<3",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
asyncio_mode = "auto"
