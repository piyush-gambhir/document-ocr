[project]
name = "document-ocr"
version = "1.0.0"
description = "High-accuracy passport OCR pipeline"
requires-python = ">=3.12"
dependencies = [
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
    "opencv-python-headless>=4.8,<5",
    "pillow>=10.0,<11",
    "numpy>=1.24,<3",
    "rapidfuzz>=3.0,<4",
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.6",

    "pymupdf>=1.23,<2",
    "pillow-heif>=0.14,<1",
    "setuptools",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
asyncio_mode = "auto"
