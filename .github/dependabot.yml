version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/deploy/docker"
      - "/deploy/lambda"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /deploy/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories:
      - "/deploy/cloudflare"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  # Separate entry so the ignore below does not hold back deploy/cloudflare, which is already on TS 7.
  - package-ecosystem: npm
    directories:
      - "/packages/passport-ocr"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # tsup's dts build (rollup-plugin-dts) needs the TS JS API, which TS 7.0 does not ship.
      # TS 7 tsc already runs through the npm:typescript@7 alias. Drop this once it supports 7.x.
      - dependency-name: typescript
        versions: ["7.x"]
  - package-ecosystem: pip
    directories:
      - "/"
      - "/packages/passport-ocr/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
