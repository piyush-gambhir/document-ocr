name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install -r requirements.lock
      - run: uv pip install -e '.[dev]' -c requirements.lock
      - run: uv run --no-sync pytest tests/python
      - run: uv build

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/passport-ocr
    env:
      PASSPORT_OCR_SKIP_PYTHON: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/passport-ocr/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test ../../tests/javascript/review.test.cjs
      - run: npm run build
      - run: npm pack --dry-run

  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
