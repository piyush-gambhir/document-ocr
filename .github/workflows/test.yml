name: Test

on:
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/python -v

      - name: Run benchmark
        run: uv run python benchmarks/accuracy.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: packages/passport-ocr
        run: npm install

      - name: Typecheck
        working-directory: packages/passport-ocr
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: packages/passport-ocr
        run: npx vitest run ../../tests/typescript
